<!DOCTYPE html>
<html>
  <head>
    <title>Xác Minh Email Thành Công</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
        background-color: #f6f8fa;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 30px 20px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
      }
      .success {
        color: #28a745;
        font-size: 28px;
        margin-bottom: 10px;
      }
      .icon {
        font-size: 48px;
        color: #28a745;
        margin-bottom: 10px;
      }
      .btn {
        display: inline-block;
        padding: 12px 32px;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        margin-top: 25px;
        font-size: 16px;
      }
      .info {
        color: #555;
        font-size: 18px;
        margin: 18px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">✅</div>
      <h1 class="success">Email đã được xác minh thành công!</h1>
      <p class="info">
        Cảm ơn bạn đã đăng ký tư vấn khóa học.<br />
        Chúng tôi đã nhận được thông tin của bạn và sẽ liên hệ tư vấn chi tiết
        trong thời gian sớm nhất.
      </p>
      <p>
        Vui lòng đợi thông tin tư vấn về khóa học qua email hoặc điện thoại mà
        bạn đã cung cấp.
      </p>
      <a href="/" class="btn">Về trang chủ</a>
    </div>
  </body>
</html>
